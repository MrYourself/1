name: Release

# A pushed version tag (v1.2.3) builds the Windows installer and portable EXE and
# publishes them as a GitHub release. Installed apps pick the update up from there.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check that the tag matches package.json
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $expected in package.json." >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run check

      # electron-builder only builds. Its own parallel uploads (setup and portable)
      # raced each other and split files across releases, so a single step below
      # creates the release with every file at once.
      - name: Build
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Publish the release
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.exe dist/*.exe.blockmap)
          # Stable builds produce latest.yml, pre-releases (v1.2.3-beta.1) beta.yml.
          channels=()
          for channel in latest beta alpha; do
            if [ -f "dist/$channel.yml" ]; then channels+=("dist/$channel.yml"); fi
          done
          if [ "${#channels[@]}" -eq 0 ]; then echo "Keine Update-Datei (latest.yml/beta.yml) in dist" >&2; exit 1; fi
          # A pre-release never becomes "latest", so stable installations do not see it.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then visibility=(--prerelease); else visibility=(--latest); fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${channels[@]}" --title "$GITHUB_REF_NAME" --generate-notes "${visibility[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
